<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
    <h1>Web Scraper Automation Platform</h1>
    <p>Scrape data and export it with ease.</p>
    </header>
    <main>
        <section class="scraper-card">
            <h2>Start a Scraping Job</h2>
            <label for="url">Website URL</label>
            <input 
                type="text"
                id="url"
                name="url"
                placeholder="Enter Website Url"
            >
            <h3>Output Format</h3>
            <div class="output-options">
                <label >
                    <input type="checkbox" name="format" value="csv">
                    CSV
                </label>
                <label>
                    <input type="checkbox" name="format" value="excel">
                    Excel
                </label>
                <label>
                    <input type="checkbox" name="format" value="json">
                    JSON
                </label>
            </div>
                <button type="button">
                    Start Scraping
                </button>
                <div id="results"></div>
            </section>
        <section class="results-card">
                <h2>Results</h2>
                <p>Records scraped: <strong>0</strong></p>

        </section>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
